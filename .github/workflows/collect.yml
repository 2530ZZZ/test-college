name: 节点搜集
on:
  schedule:
    - cron: '37 14 * * *'   # UTC 14:37 → 北京时间 22:37
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_NO_WARNINGS: "1"
    permissions:
      contents: write
      actions: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 运行搜集
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py

      - name: 提交结果
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          BEIJING_TIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')
          export GIT_AUTHOR_DATE="$BEIJING_TIME +0800"
          export GIT_COMMITTER_DATE="$BEIJING_TIME +0800"
          git add no/ 2>/dev/null || true
          git add -A no/ 2>/dev/null || true
          for f in no.txt no_li.txt no_w_li.txt ljck.txt sha_cache.pkl alive.txt; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -d batches/ ] && git add batches/ || true
          [ -d log/ ] && git add log/ || true
          git commit -m "自动更新 - $BEIJING_TIME CST" || echo "No changes to commit"
          git push
