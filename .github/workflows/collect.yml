name: 动态搜集 + 测速
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时一次
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_NO_WARNINGS: "1"
    permissions:
      contents: write
      actions: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: pip install requests pyyaml

      - name: 下载 subs-check
        run: |
          set +e
          FALLBACK_TAG="v1.6.0"

          download_and_extract() {
            local tag="$1"
            local url="https://github.com/beck-8/subs-check/releases/download/${tag}/subs-check_Linux_x86_64.tar.gz"
            echo "  下载 ${url} ..."
            curl -sL "$url" -o subs-check.tar.gz
            if [ -f subs-check.tar.gz ] && [ -s subs-check.tar.gz ]; then
              tar xzf subs-check.tar.gz
              chmod +x subs-check
              return 0
            fi
            return 1
          }

          # 获取最新 tag
          TAG=$(curl -s "https://api.github.com/repos/beck-8/subs-check/releases/latest" \
            | grep '"tag_name":' | cut -d'"' -f4)
          echo "最新版本: ${TAG:-获取失败}"

          # 尝试最新版
          if [ -n "$TAG" ] && download_and_extract "$TAG"; then
            echo "subs-check ${TAG} 就绪"
          elif download_and_extract "$FALLBACK_TAG"; then
            echo "最新版下载失败，回退到 ${FALLBACK_TAG}"
          else
            echo "subs-check 所有版本下载失败，测速将跳过"
          fi
        continue-on-error: true

      - name: 运行搜集 + 测速
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py

      - name: 提交所有结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BEIJING_TIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')
          export GIT_AUTHOR_DATE="$BEIJING_TIME +0800"
          export GIT_COMMITTER_DATE="$BEIJING_TIME +0800"
          git add -A no/
          git add no.txt no_li.txt no_w_li.txt ljck.txt sha_cache.pkl
          git add alive.txt mihomo.yaml
          git add no_batch_*.txt
          git add log/
          git commit -m "自动更新 + 测速 - $BEIJING_TIME CST" || echo "No changes to commit"
          git push
