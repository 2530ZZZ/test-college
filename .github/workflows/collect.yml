name: 动态搜集 + 测速
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时一次
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_NO_WARNINGS: "1"
    permissions:
      contents: write
      actions: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: pip install requests pyyaml

      - name: 下载 subs-check
        run: |
          set +e
          curl -sL "https://github.com/beck-8/subs-check/releases/latest/download/subs-check-linux-amd64" \
            -o subs-check
          if [ -f subs-check ] && [ -s subs-check ]; then
            chmod +x subs-check
            echo "subs-check 就绪"
          else
            echo "subs-check 下载失败，测速将跳过"
          fi
        continue-on-error: true

      - name: 运行搜集 + 测速
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py

      - name: 提交所有结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BEIJING_TIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')
          export GIT_AUTHOR_DATE="$BEIJING_TIME +0800"
          export GIT_COMMITTER_DATE="$BEIJING_TIME +0800"
          git add -A no/
          git add no.txt no_li.txt no_w_li.txt ljck.txt sha_cache.pkl
          git add alive.txt mihomo.yaml
          git add no_batch_*.txt
          git add log/
          git commit -m "自动更新 + 测速 - $BEIJING_TIME CST" || echo "No changes to commit"
          git push
