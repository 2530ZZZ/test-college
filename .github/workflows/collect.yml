name: 动态搜集

on:
  schedule:
    - cron: '0 0 1 * *'   # UTC 04:00,10:00,16:00,22:00 → 北京时间 12:00,18:00,00:00,06:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_NO_WARNINGS: "1"
    permissions:
      contents: write
      actions: read

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests geoip2
          # 如果不想使用 geoip2，可删除上面一行，程序会自动回退到域名推测

      - name: 运行动态搜集+测速
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 提交所有结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BEIJING_TIME=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')
          export GIT_AUTHOR_DATE="$BEIJING_TIME +0800"
          export GIT_COMMITTER_DATE="$BEIJING_TIME +0800"
          git add -A no/
          git add no.txt no_li.txt no_w_li.txt ljck.txt repo_commit_cache.txt dr_commit_cache.txt
          git add alive.txt fi_no.txt jd.txt fi_no_w_li.txt
          git add GeoLite2-City.mmdb || true   # 若下载了数据库也提交
          git commit -m "自动更新 + 测速 + 国旗排序 - $BEIJING_TIME CST" || echo "No changes"
          git push
